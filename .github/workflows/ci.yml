name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      # Cached separately from the test run so a dependency-resolution failure
      # is distinguishable from a compile failure in the log.
      - name: Build (debug)
        run: swift build -v

      - name: Test
        run: swift test

  package:
    name: Package .app
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # Proves the distributable actually assembles — the bundle layout, the
      # ad-hoc signature and the DMG are the parts most likely to break
      # silently, since nothing else in the build exercises them.
      - name: Package
        run: Scripts/package_app.sh

      - name: Verify bundle
        run: |
          APP=dist/Ullage.app
          test -x "$APP/Contents/MacOS/Ullage"
          plutil -lint "$APP/Contents/Info.plist"
          # LSUIElement is what keeps it out of the Dock; losing it would be a
          # silent regression that only shows up on someone's machine.
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$APP/Contents/Info.plist")" = "true"
          # The pricing table must reach the bundle, or every model reads as
          # "unpriced" in the shipped app while tests still pass.
          test -f "$APP/Contents/Resources/model_prices.json"
          codesign --verify --deep --strict "$APP"
          lipo -archs "$APP/Contents/MacOS/Ullage"

      - uses: actions/upload-artifact@v4
        with:
          name: Ullage-dmg
          path: dist/*.dmg
          if-no-files-found: error
