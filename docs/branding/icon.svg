<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2f37"/>
      <stop offset="100%" stop-color="#181b1f"/>
    </linearGradient>
    <linearGradient id="fill" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3fc7b0"/>
      <stop offset="100%" stop-color="#3f8ec7"/>
    </linearGradient>
    <linearGradient id="glassStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a8afb8"/>
      <stop offset="35%" stop-color="#7b828c"/>
      <stop offset="65%" stop-color="#8b929c"/>
      <stop offset="100%" stop-color="#a8afb8"/>
    </linearGradient>
    <clipPath id="capsuleClip">
      <rect x="196" y="96" width="120" height="320" rx="60" ry="60"/>
    </clipPath>
  </defs>

  <!-- app-icon rounded square -->
  <rect x="8" y="8" width="496" height="496" rx="112" ry="112" fill="url(#bg)"/>

  <g transform="translate(256,256) scale(1.3) translate(-256,-256)">
  <g clip-path="url(#capsuleClip)">
    <!-- faint glass-tube reflection, visible through both air gap and liquid -->
    <rect x="206" y="96" width="14" height="320" fill="#ffffff" opacity="0.10"/>
    <rect x="292" y="96" width="8" height="320" fill="#ffffff" opacity="0.06"/>

    <!-- liquid, now filling more than half, with a bigger wave -->
    <path d="M196,225 C230,198 284,252 316,215 L316,416 L196,416 Z" fill="url(#fill)"/>
    <path d="M196,236 C238,256 276,204 316,232 L316,416 L196,416 Z" fill="#2f6f95" opacity="0.35"/>
    <path d="M196,225 C230,198 284,252 316,215" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.4"/>
    <ellipse cx="235" cy="320" rx="18" ry="66" fill="#ffffff" opacity="0.12" transform="rotate(-18 235 320)"/>
  </g>

  <!-- capsule outline, glassy gradient rim -->
  <rect x="196" y="96" width="120" height="320" rx="60" ry="60"
        fill="none" stroke="url(#glassStroke)" stroke-width="9" stroke-opacity="0.85"/>
  <!-- crisp inner rim line for glass edge definition -->
  <rect x="201" y="101" width="110" height="310" rx="55" ry="55"
        fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.12"/>

  <!-- ullage markers -->
  <g stroke="#5b6470" stroke-width="5" stroke-linecap="round" opacity="0.6">
    <line x1="220" y1="128" x2="238" y2="128"/>
    <line x1="220" y1="160" x2="238" y2="160"/>
    <line x1="220" y1="192" x2="238" y2="192"/>
  </g>
  </g>
</svg>
